<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Layora Quick Access</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <!-- The two workspaces. A button is enabled only once that workspace is
         connected; the active one is pressed. Filled in by popup.js. -->
    <div class="switch" id="switch" role="group" aria-label="Workspace">
      <button class="switch-btn" id="svc-layora" data-service="layora" type="button" disabled>
        Layora
      </button>
      <button class="switch-btn" id="svc-clubcrumbs" data-service="clubcrumbs" type="button" disabled>
        Club-Crumbs
      </button>
    </div>
    <button class="open-button" id="open-dashboard" type="button" title="Open the dashboard">
      Open <span aria-hidden="true">&rarr;</span>
    </button>
  </header>

  <!-- The connected account, in the active workspace. -->
  <p class="who" id="who" hidden></p>

  <!-- Shown until we know whether this extension is connected. -->
  <div class="state" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p class="muted">Loading…</p>
  </div>

  <!-- The active workspace is not connected yet. Buttons injected by popup.js. -->
  <div class="state" id="gate" hidden>
    <p class="gate-title" id="gate-title">Connect a workspace</p>
    <p class="muted gate-body" id="gate-body">
      Sign in on a workspace and press Connect. Your launchers and courses then
      open from here, one click from any tab.
    </p>
    <div class="gate-actions" id="gate-actions"></div>
  </div>

  <!-- Connected. -->
  <main id="app" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-launchers" role="tab" aria-selected="true">Quicklaunch</button>
      <button class="tab" id="tab-courses" role="tab" aria-selected="false">Courses</button>
    </nav>

    <section class="panel" id="panel-launchers" role="tabpanel">
      <ul class="list list-grid" id="launchers"></ul>

      <p class="empty" id="launchers-empty" hidden>
        No quick launchers yet. Add your first one below.
      </p>

      <form class="add" id="add-form">
        <input
          type="text" id="add-url" name="url" required
          placeholder="Paste a link, e.g. leetcode.com"
          autocomplete="off" spellcheck="false"
        />
        <input
          type="text" id="add-name" name="name"
          placeholder="Name (optional)" autocomplete="off"
        />
        <div class="add-row">
          <button type="submit" class="primary small" id="add-submit">Add</button>
          <button type="button" class="ghost small" id="add-cancel">Cancel</button>
        </div>
      </form>

      <button class="fab" id="add-open" title="Add a quick launcher">+ Add a link</button>
    </section>

    <section class="panel" id="panel-courses" role="tabpanel" hidden>
      <ul class="list" id="courses"></ul>
      <p class="empty" id="courses-empty" hidden>
        No courses yet. Add one on the site and it shows up here.
      </p>
      <button class="ghost wide" id="open-courses">Open courses</button>
    </section>

    <p class="notice" id="notice" hidden></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
